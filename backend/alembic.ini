[alembic]
script_location = migrations
prepend_sys_path = .
# URL 은 여기 적지 않는다 — `migrations/env.py` 가 설정에서 읽는다.
# 적어 두면 두 벌이 되고, 두 벌이면 반드시 갈린다.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
