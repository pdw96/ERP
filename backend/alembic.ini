[alembic]
script_location = migrations
prepend_sys_path = .
# alembic 1.20 부터 이것이 없으면 옛 방식(공백 · 쉼표 · 콜론)으로 쪼갠다며 폐기 경고를 낸다.
# 경로가 `.` 하나라 뜻은 같다 — 경고를 오류로 다루는 검사(`pyproject.toml`)가 떨어지지 않게 적는다.
path_separator = os
# URL 은 여기 적지 않는다 — `migrations/env.py` 가 설정에서 읽는다.
# 적어 두면 두 벌이 되고, 두 벌이면 반드시 갈린다.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
