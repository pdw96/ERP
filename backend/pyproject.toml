[project]
name = "erp"
version = "0.1.0"
description = "조기경보 ERP — 기준정보와 품질 기준"
# 하한이 3.11 인 것은 **이 저장소를 손으로 검증할 수 있게 하기 위해서**다.
# 컨테이너는 3.12 를 쓰지만, 개발자의 로컬이 3.11 이어도 같은 테스트가 돈다.
requires-python = ">=3.11"

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff 고유 — RUF001/002/003 이 한글 주석의 전각 문장부호를 잡는다
]
ignore = [
    # 이 저장소의 주석과 docstring 은 한국어이고 「」· — 같은 전각 기호를 쓴다.
    # 혼동 문자 경고는 여기서 소음일 뿐이다.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# 자동 생성된 마이그레이션은 CHECK 식을 **한 줄 문자열로** 굽는다. 한 줄로 두는
# 이유는 **diff 가 커지지 않게** 하는 것이다 — 그래야 식이 바뀐 자리만 보인다.
#
# **정합 테스트는 이 차이를 잡지 않는다.** `pg_get_constraintdef` 가 식을 정규화하므로
# 공백과 줄바꿈은 비교 전에 사라진다(직접 재현했다). 그 테스트가 잡는 것은 **뜻이
# 달라진 자리**다. 여기서 줄길이를 풀어 주는 것은 그 때문이 아니라 위의 diff 때문이다.
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
# **범위는 여기 한 자리다** — CI 와 로컬은 인자 없이 `mypy` 를 부른다. 테스트 가운데 검사 장치인
# 게이트 파일만 넣는다(ADR 0007). 게이트 파일의 목록은 `tests/test_prose.py` 의 `_GATE_FILES` 이고,
# `tests/test_dependencies.py` 가 둘을 견준다 — 목록을 두 벌 두지 않는다
files = [
    "app",
    "migrations",
    "tests/test_prose.py",
    "tests/test_boundary.py",
    "tests/test_dependencies.py",
]
# **SQLAlchemy 의 mypy 플러그인을 쓰지 않는다.** 2.0 에서 deprecated 되었고
# mypy 1.10.1 까지만 지원하는데 이 저장소는 1.14 를 고정한다 — 켜 두면 도는지
# 안 도는지 모르는 채로 「검사하고 있다」고 믿게 된다.
#
# 필요도 없다. 모델이 전부 `Mapped[...]` · `mapped_column()` 네이티브 선언이라
# 플러그인 없이도 타입이 읽힌다: `Mapped[str]` 을 int 로 돌려주거나
# `int | None` 에 바로 더하면 mypy 가 그대로 잡는다(확인함).

[[tool.mypy.overrides]]
# cmark-gfm 의 바인딩은 타입 정보(스텁 · `py.typed`)를 싣지 않고 스텁 패키지도 없다 — 게이트
# 파일이 부르는 자리만 `Any` 로 읽는다
module = ["cmarkgfm", "cmarkgfm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
# 테스트에서 반환형을 일일이 적게 하면 읽기만 나빠진다.
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# 실패를 조용히 넘기지 않는다 — 경고도 실패로 올린다.
filterwarnings = [
    "error",
    # **서드파티 하나만 좁게 뺀다.** starlette 의 `testclient` 가 import 시점에
    # `anyio.abc.BlockingPortal` 을 부르는데 anyio 가 그 별칭을 폐기했다. 고칠
    # 자리가 우리 코드가 아니고, 통째로 끄면 우리 코드의 폐기 경고까지 함께
    # 사라진다. **메시지를 그대로 적어** 무엇을 빼고 있는지 읽히게 둔다 —
    # starlette 가 고치는 날 이 줄은 아무것도 막지 않게 된다.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
addopts = "-ra --strict-markers --strict-config"
