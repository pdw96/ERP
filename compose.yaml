# **상주 서비스가 하나 생겼다 — 쓰기 엔드포인트.** `migrate` 는 여전히
# 마이그레이션과 시드를 돌리고 끝나는 일회성 잡이고, `api` 는 그것이 끝난 뒤에
# 뜬다. **화면은 없다** — 부르는 것은 사람의 브라우저가 아니라 다음 층이다.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      # **루프백에만 연다.** 모든 인터페이스에 열면 같은 네트워크의 누구나
      # 고정된 `erp` 비밀번호로 개발 데이터베이스에 붙을 수 있다.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 마이그레이션이 붙기 전에 DB 가 받을 준비가 되어야 한다.
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ERP_DATABASE_URL: postgresql+psycopg://erp:erp@postgres:5432/erp
      # 개발과 시연에서만 켠다.
      ERP_SEED_ENABLED: "true"
    command: ["true"]

  api:
    # **이 서비스도 `migrate` 와 같은 이미지·같은 엔트리포인트다** — 뜰 때마다
    # `alembic upgrade head` 를 다시 돈다. 그래서 **코드만 되돌리면 뜨지 않는다**
    # (감사 ⑬ NC-146). 근거와 넓히는 방법은 `backend/docker-entrypoint.sh` 머리에
    # 있다 — 여기 두 벌로 적지 않는다.
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      # **표가 먼저다.** 마이그레이션이 끝나기 전에 뜨면 첫 요청이 없는 표를
      # 찾는다 — 시드 판단의 조건 ① 이 여기서도 같은 이유로 선다.
      migrate:
        condition: service_completed_successfully
    environment:
      ERP_DATABASE_URL: postgresql+psycopg://erp:erp@postgres:5432/erp
    ports:
      # **루프백에만 연다.** 인증이 없는 쓰기 엔드포인트이고, 모든 인터페이스에
      # 열면 같은 네트워크의 누구나 로트를 만들 수 있다. 권한 층이 서는 것은
      # 사람이 늘어나는 날이며 그때까지 경계는 이 한 줄이다.
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "app.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgdata:
