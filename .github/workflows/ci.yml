name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치의 옛 실행은 의미가 없다 — 새 푸시가 옛 것을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # 테스트는 실제 PostgreSQL 에 붙는다. SQLite 로 대신하면 이 설계가
      # 제약에 기대는 자리를 검증할 수 없다.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 의존성
        run: pip install -r requirements-dev.txt

      - name: 린트
        run: ruff check .

      - name: 포맷
        run: ruff format --check .

      - name: 타입체크
        run: mypy app migrations

      - name: 테스트
        env:
          ERP_TEST_DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
        run: pytest

      # ── 컨테이너 부팅 경로 (감사 ⑪ NC-133) ────────────────────────────────
      # **이 잡에 붙인다. 새 잡을 만들지 않는다.** 필수 상태 체크는 잡 이름으로
      # 거는데 새 잡은 그 목록에 없으므로, 초록이어도 아무것도 막지 못한다 —
      # 「무엇을 잡든 머지를 막지 못하면 잡은 것이 아니다」가 그 자리다(NC-101).
      #
      # 셸은 ruff 도 mypy 도 보지 않고 pytest 도 실행하지 않는다 — 이 스텝이
      # 그 빈자리를 **문법과 흔한 셸 함정까지** 메운다.
      #
      # **이 스텝이 못 보는 것**(가드는 자기가 못 보는 부류를 적는다, W-6 ③):
      # `set -euo pipefail` 이 **사라지는 것**. shellcheck 는 그 줄을 요구하지
      # 않으므로 지워도 통과한다 — 실제로 돌려 확인했다(감사 ⑬ NC-147). 그 줄이
      # 없으면 `alembic upgrade head` 가 실패해도 `exec "$@"` 가 돌아 **반쯤
      # 마이그레이션된 DB 위에 API 가 뜨는데**, 그것을 무는 것은 여전히 사람이다.
      # 그리고 이 스텝은 **엔트리포인트를 실행하지 않는다.** 실행 비트는
      # `tests/test_boundary.py` 가 문다(감사 ⑮ NC-155).
      #
      # **파일을 이름으로 들지 않는다** (감사 ⑮ NC-154). 이름으로 들면 오늘
      # `.sh` 가 하나뿐이라 맞지만 **둘째가 생기는 날 아무 소리 없이 검사 밖에
      # 선다.** 목록은 git 이 든다 — 「목록을 두 벌 두지 않는다」가 그 자리다.
      # 이 잡이 `backend` 에서 돌므로 **`:(top)` 로 저장소 전체**를 가리킨다 —
      # 그것이 없으면 `backend` 밖의 셸이 다시 검사 밖에 선다(심어서 확인했다).
      - name: 셸
        run: git ls-files -z ':(top)*.sh' | xargs -0 --no-run-if-empty shellcheck

      # 이미지를 **빌드해 본다.** 이것이 없으면 `Dockerfile` 이나
      # `requirements.txt` 가 깨져도 CI 는 전부 초록이다 — CI 는 이미지를 쓰지
      # 않고 `requirements-dev.txt` 로 따로 깔기 때문이다.
      #
      # **이 스텝이 못 보는 것**(W-6 ③, 감사 ⑮ NC-154): 빌드가 초록인 것과
      # 이미지가 **뜨는** 것은 다르다. `COPY . .` 는 `.dockerignore` 가 필요한
      # 경로를 가려도 **실패하지 않고**, `ENTRYPOINT` 도 실행 비트도 검증하지
      # 않으며, 런타임은 한 줄도 돌지 않는다. 앞의 둘은 `tests/test_boundary.py`
      # 가 저장소 안에서 물고(NC-155), **띄우는 것**은 DB 와 환경변수를 요구해
      # 여기 없다 — 그 층은 `audit-ops` 의 자리다.
      - name: 이미지
        run: docker build -t erp-api:ci .

      # ── 기동 (감사 ⑰ NC-165) ──────────────────────────────────────────────
      # **빌드가 초록인 것과 이미지가 뜨는 것은 다르다.** 기동 경로의 전제 셋은
      # 게이트를 얻었는데(문법 · 컨텍스트 · 실행 비트) **그 스크립트를 실제로
      # 돌리는 자리가 없었다** — NC-146 이 낸 사고(「코드만 되돌리면 API 가 뜨지
      # 못한다」)가 오직 기동에서만 드러나는 부류인데 그렇다.
      #
      # 여기서 처음 도는 것들: `ENTRYPOINT` 가 실제로 실행되는가 · `exec "$@"` 가
      # 인자를 넘기는가 · `USER erp` 로 `alembic` 이 도는가 · 시드 스위치가
      # 갈리는가 · uvicorn 이 `app.api.app:app` 을 import 해 실제로 답하는가.
      # 마지막 것이 특히 얇았다 — 루트 로거 설정은 `pragma: no cover` 라
      # **검사가 한 번도 지나가지 않는다.**
      #
      # **compose 를 쓰지 않는다.** `compose.yaml` 의 postgres 가 5432 를 여는데
      # 이 잡의 서비스가 이미 그 포트를 들고 있어 부딪친다. 이미지를 직접 띄워
      # 그 서비스에 붙인다 — 이 스텝이 보는 것은 **이미지의 기동**이지 compose 의
      # 배선이 아니다.
      #
      # **이 스텝이 못 보는 것**(W-6 ③): compose 의 `depends_on` 순서와 볼륨,
      # 되돌린 이미지로 뜨는 것(NC-146 의 그 사고 자체), 그리고 오래 떠 있을 때
      # 생기는 것 전부.
      - name: 기동
        run: |
          set -euo pipefail
          psql "postgresql://erp:erp@localhost:5432/erp_test" -c 'CREATE DATABASE erp_boot'
          docker run -d --name erp-boot --network host \
            -e ERP_DATABASE_URL=postgresql+psycopg://erp:erp@localhost:5432/erp_boot \
            -e ERP_SEED_ENABLED=true \
            erp-api:ci uvicorn app.api.app:app --host 127.0.0.1 --port 8000
          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker logs erp-boot
          # 마이그레이션과 시드가 이 이미지 안에서 실제로 돌았는지 로그가 말한다.
          docker logs erp-boot 2>&1 | grep -q '\[1/2\] 마이그레이션'
          docker logs erp-boot 2>&1 | grep -q '\[2/2\] 시드'
          # 그리고 실제로 답한다 — 읽는 엔드포인트가 없으므로 쓰기로 민다.
          curl -fsS -o /dev/null -X POST http://127.0.0.1:8000/inspections \
            -H 'content-type: application/json' \
            -d '{"item_code":"RM-01","supplier_code":"SUP-01",
                 "supplier_lot_number":"SL-CI-0001","quantity":500.0,
                 "judged_by":"검사원 1","received_date":"2026-09-21",
                 "measurements":[{"item_code":"점도","value":3000.0},
                                 {"item_code":"수분","value":0.3},
                                 {"item_code":"색차","value":0.5}]}'
          docker rm -f erp-boot
