name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치의 옛 실행은 의미가 없다 — 새 푸시가 옛 것을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # 테스트는 실제 PostgreSQL 에 붙는다. SQLite 로 대신하면 이 설계가
      # 제약에 기대는 자리를 검증할 수 없다.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 의존성
        run: pip install -r requirements-dev.txt

      - name: 린트
        run: ruff check .

      - name: 포맷
        run: ruff format --check .

      - name: 타입체크
        run: mypy app migrations

      - name: 테스트
        env:
          ERP_TEST_DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
        run: pytest
